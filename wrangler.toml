name = "burritowrap"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Your domain is on Cloudflare, so deploying creates the DNS record
# and HTTPS certificate for this hostname automatically.
# (Must stay above any [section] header, or TOML puts it inside that section.)
routes = [
  { pattern = "wrap.burrito.rip", custom_domain = true }
]

# Serve the webpage (public/) from the same Worker.
# Requests for files that exist in public/ are served directly;
# /ws/* always goes to src/worker.js.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/ws/*"]

# One Durable Object instance per clipboard room.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
